# ---------------------------------------------------------------------------
# CE FICHIER NE CORRESPOND PAS À L'INSTALLATION ACTUELLE DU PI.
#
# Le Pi utilise un tunnel « géré à distance » (conteneur cloudflared démarré
# avec un TUNNEL_TOKEN) : il n'existe aucun config.yml, et les sous-domaines
# s'ajoutent dans le tableau de bord Zero Trust.
#   -> lire deploy/publication-cloudflare.md
#
# Ce modèle ne sert que si le tunnel est un jour repassé en mode « géré
# localement », c'est-à-dire décrit par un fichier au lieu d'un jeton.
# ---------------------------------------------------------------------------

tunnel: <NOM-OU-UUID-DU-TUNNEL>
credentials-file: /etc/cloudflared/<UUID>.json

ingress:
  - hostname: tuneps.texbanner.com
    # Adresse vue DEPUIS cloudflared. Si cloudflared tourne dans un conteneur
    # et l'interface en natif sur l'hôte, ce n'est PAS 127.0.0.1 : voir
    # publication-cloudflare.md, « Pourquoi host.docker.internal ».
    service: http://host.docker.internal:8765
    originRequest:
      connectTimeout: 30s

  # ... les autres règles ...

  # Fourre-tout : TOUJOURS en dernier. Toute règle écrite après lui est
  # ignorée en silence, et le symptôme est un 404 Cloudflare inexpliqué.
  - service: http_status:404

# ---------------------------------------------------------------------------
# Dans les deux modes, la limite des ~100 s (HTTP 524) s'applique : l'import
# profond « depuis TUNEPS » (2 h 30) ne peut pas aboutir à travers le domaine.
# ---------------------------------------------------------------------------
